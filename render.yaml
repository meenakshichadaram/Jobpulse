services:
  - type: web
    name: jobpulse-engine
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REMOTE_SOURCE_URL
        value: https://remotive.com/api/remote-jobs
